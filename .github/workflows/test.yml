name: CI

on:
    push:
        branches-ignore:
            - main

concurrency:
    group: ${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    test:
        name: Run tests
        
        runs-on: ${{ matrix.os }}
        
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest ]
                
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                
            -   name: Set up JDK 25
                uses: actions/setup-java@v4
                with:
                    distribution: zulu
                    java-version: 25
                    cache: maven
                    
            -   name: Run unit tests
                run: mvn -B -ntp test
